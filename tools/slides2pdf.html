<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slides2pdf has moved to DeckSift</title>
  <meta name="description" content="slides2pdf has moved to DeckSift, a browser-based video slide extractor.">
  <link rel="canonical" href="https://lazy3128-design.github.io/decksift/">
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Yu Gothic", Meiryo, sans-serif;
      color: #1f2328;
      background: #f6f8fa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    main {
      width: min(680px, 100%);
      border-top: 4px solid #1f883d;
      padding-top: 28px;
    }
    .previous {
      margin: 0 0 10px;
      color: #59636e;
      font-size: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 48px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .lead {
      margin: 22px 0 0;
      max-width: 58ch;
      font-size: 17px;
      line-height: 1.8;
    }
    .english {
      margin: 14px 0 0;
      color: #59636e;
      font-size: 14px;
      line-height: 1.7;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 700;
      text-decoration: none;
    }
    .primary {
      color: #fff;
      background: #1f883d;
    }
    .secondary {
      color: #0969da;
      border: 1px solid #d0d7de;
      background: #fff;
    }
    a:focus-visible {
      outline: 3px solid #0969da;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <p class="previous">Formerly slides2pdf</p>
    <h1>DeckSiftへ移動しました</h1>
    <p class="lead">
      動画からスライドを抽出するツール「slides2pdf」は、DeckSiftとして独立したオープンソースプロジェクトになりました。
      WebP・PNG・分割ZIP・PDF・時刻CSVの出力に対応しています。
    </p>
    <p class="english">
      slides2pdf is now DeckSift. The tool has moved to a dedicated open-source repository and a new live demo.
    </p>
    <nav aria-label="DeckSift links">
      <a class="primary" href="https://lazy3128-design.github.io/decksift/">DeckSiftを開く</a>
      <a class="secondary" href="https://github.com/lazy3128-design/decksift">GitHubで見る</a>
    </nav>
  </main>
</body>
</html>
